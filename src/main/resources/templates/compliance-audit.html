<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head}">
  <meta charset="utf-8" />
</head>

<body>
  <div th:replace="~{fragments/navbar :: navbar}"></div>
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>

  <div class="main-content">
    <div class="container-fluid mt-2 px-md-4">
      
      <!-- Page Header -->
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 pb-3 border-bottom">
        <div class="mb-3 mb-md-0">
          <h4 class="fw-bold text-dark mb-1">
            <i class="bi bi-journal-text text-primary me-2"></i> System Audit Trail
          </h4>
          <p class="text-muted small mb-0">Monitor automated system activity, user logins, and administrative actions.</p>
        </div>
        <a class="btn btn-dark rounded-pill fw-bold shadow-sm px-4" th:href="@{/reports/audit}">
          <i class="bi bi-download me-1"></i> Export Master Log
        </a>
      </div>

      <!-- Data Table Card -->
      <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        
        <!-- Subtle gradient accent bar -->
        <div style="height: 4px; background: var(--brand-gradient);"></div>
        
        <div class="card-body p-4"> <!-- Added padding for DataTables controls to sit nicely -->
          <div class="table-responsive">
            <table id="auditLogsTable" class="table table-hover align-middle text-nowrap mb-0 w-100">
              <thead class="bg-light">
                <tr>
                  <th class="border-0 px-4 py-3 text-muted small fw-bold text-uppercase">Log ID</th>
                  <th class="border-0 px-4 py-3 text-muted small fw-bold text-uppercase">Timestamp</th>
                  <th class="border-0 px-4 py-3 text-muted small fw-bold text-uppercase">User</th>
                  <th class="border-0 px-4 py-3 text-muted small fw-bold text-uppercase">Action</th>
                </tr>
              </thead>
              <tbody class="border-top-0">
                
                <tr th:each="log : ${logs}">
                  <td class="px-4 py-3 text-muted font-monospace small" th:text="${'#' + log.id}">#101</td>
                  
                  <td class="px-4 py-3 text-muted fw-medium" th:text="${#temporals.format(log.timestamp, 'dd MMM yyyy, HH:mm:ss')}">
                    Date & Time
                  </td>
                  
                  <td class="px-4 py-3">
                    <div class="d-flex align-items-center">
                      <div class="bg-secondary bg-opacity-10 text-secondary rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 32px; height: 32px;">
                        <i class="bi bi-person-fill"></i>
                      </div>
                      <span class="fw-bold text-dark" th:text="${log.username}">admin</span>
                    </div>
                  </td>
                  
                  <td class="px-4 py-3">
                    <span class="badge bg-light text-secondary-emphasis border px-3 py-2 fw-semibold rounded-pill text-uppercase" th:text="${log.action}">LOGIN</span>
                  </td>
                </tr>
                
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Required Scripts for DataTables -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/app.js}"></script>

  <!-- DataTables Initialization -->
  <script th:inline="none">
    $(document).ready(function() {
        $('#auditLogsTable').DataTable({
            "pageLength": 20,
            "ordering": true,
            "order": [[ 1, "desc" ]], // Changed index to 1 to sort by the new Timestamp column correctly
            "searching": true,
            "lengthChange": true,
            "language": {
                "search": "Filter Logs:",
                // Styling classes for DataTables elements to match Bootstrap 5
                "searchPlaceholder": "Search records..."
            }
        });
    });
  </script>
</body>

</html>
