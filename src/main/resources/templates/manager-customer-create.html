<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head}"></head>

<body>
  <div th:replace="~{fragments/navbar :: navbar}"></div>
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>

  <!-- Centered Focus Layout -->
  <div class="main-content d-flex flex-column align-items-center justify-content-center py-4" style="min-height: calc(100vh - 64px);">
    <div class="container" style="max-width: 600px">
      
      <!-- Error Alert -->
      <div class="alert alert-danger alert-dismissible fade show border-0 shadow-sm rounded-4 mb-4" th:if="${error}">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
        <button class="btn-close" data-bs-dismiss="alert" type="button"></button>
      </div>

      <!-- Premium Onboarding Card -->
      <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        
        <!-- Subtle gradient accent bar -->
        <div style="height: 6px; background: var(--brand-gradient);"></div>
        
        <div class="card-body p-4 p-md-5">
          
          <!-- Icon Header -->
          <div class="text-center mb-4 pb-2">
            <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
              <i class="bi bi-person-plus-fill fs-2"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">Onboard Walk-in Customer</h4>
            <p class="text-muted small">Register a new walk-in customer profile and assign system credentials.</p>
          </div>

          <form method="post" th:action="@{/manager/customers/create}" th:object="${user}">
            
            <!-- Username -->
            <div class="mb-4">
              <label class="form-label text-muted fw-semibold small text-uppercase">Username</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-person"></i></span>
                <input id="usernameInput" class="form-control bg-light border-0 shadow-none ps-2" placeholder="Create a unique login ID" required th:field="*{username}" type="text" />
              </div>
              <small id="usernameFeedback" class="form-text mt-1 d-block"></small>
            </div>

            <!-- Email Address -->
            <div class="mb-4">
              <label class="form-label text-muted fw-semibold small text-uppercase">Email Address</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-envelope"></i></span>
                <input id="emailInput" class="form-control bg-light border-0 shadow-none ps-2" placeholder="customer@email.com" required th:field="*{email}" type="email" />
              </div>
              <small id="emailFeedback" class="form-text mt-1 d-block"></small>
            </div>

            <!-- Temporary Password -->
            <div class="mb-4">
              <label class="form-label text-muted fw-semibold small text-uppercase">Temporary Password</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-key"></i></span>
                <input class="form-control bg-light border-0 shadow-none ps-2" placeholder="Assign temporary password" required th:field="*{password}" type="password" />
              </div>
              <div class="form-text small text-muted mt-2">
                <i class="bi bi-info-circle me-1"></i> Customer will be prompted to change this upon first login.
              </div>
            </div>

            <!-- Submit Action -->
            <div class="d-grid mt-4">
              <button class="btn btn-primary btn-lg rounded-pill fw-bold shadow-sm" type="submit">
                Create Customer Profile <i class="bi bi-arrow-right ms-2"></i>
              </button>
            </div>
            
          </form>
        </div>
      </div>

      <!-- Back Link -->
      <div class="text-center mt-4">
        <a class="text-decoration-none fw-medium text-muted hover-primary" th:href="@{/manager/users}">
          <i class="bi bi-arrow-left me-1"></i> Back to Customer Search
        </a>
      </div>
      
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/app.js}"></script>
  
  <!-- Real-time Validation Script (Preserved exactly) -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
        const usernameInput = document.getElementById('usernameInput');
        const feedback = document.getElementById('usernameFeedback');
        let typingTimer;
        const emailInput = document.getElementById('emailInput');
        const emailFeedback = document.getElementById('emailFeedback');
        let emailTypingTimer;
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const doneTypingInterval = 500; // Time in ms (0.5 seconds)

        usernameInput.addEventListener('input', function () {
          clearTimeout(typingTimer);
          const username = usernameInput.value.trim();

          // Reset UI if input is cleared or too short
          if (username.length < 3) {
            feedback.textContent = 'Username should be at least 3 characters.';
            feedback.className = 'form-text text-muted mt-1 d-block';
            usernameInput.classList.remove('is-valid', 'is-invalid');
            return;
          }

          feedback.textContent = 'Checking availability...';
          feedback.className = 'form-text text-info mt-1 d-block';

          // Start the countdown
          typingTimer = setTimeout(function () {
            checkUsername(username);
          }, doneTypingInterval);
        });

        emailInput.addEventListener('input', function () {
          clearTimeout(emailTypingTimer);
          const email = emailInput.value.trim();

          // Reset UI if input is cleared
          if (email.length === 0) {
            emailFeedback.textContent = '';
            emailInput.classList.remove('is-valid', 'is-invalid');
            return;
          }

          // Check if it looks like a real email before pinging the server
          if (!emailRegex.test(email)) {
            emailFeedback.textContent = 'Please enter a valid email format.';
            emailFeedback.className = 'form-text text-muted mt-1 d-block';
            emailInput.classList.remove('is-valid');
            emailInput.classList.add('is-invalid');
            return;
          }

          emailFeedback.textContent = 'Checking availability...';
          emailFeedback.className = 'form-text text-info mt-1 d-block';

          // Start the countdown using the same doneTypingInterval (500ms)
          emailTypingTimer = setTimeout(function () {
            checkEmail(email);
          }, doneTypingInterval);
        });

        function checkUsername(username) {
          // Call the backend endpoint
          fetch(`/manager/api/check-username?username=${encodeURIComponent(username)}`)
            .then(response => response.json())
            .then(data => {
              if (data.available) {
                feedback.textContent = 'Username is available!';
                feedback.className = 'form-text text-success mt-1 fw-bold d-block';
                usernameInput.classList.remove('is-invalid');
                usernameInput.classList.add('is-valid');
              } else {
                feedback.textContent = 'Username is already taken. Please choose another.';
                feedback.className = 'form-text text-danger mt-1 fw-bold d-block';
                usernameInput.classList.remove('is-valid');
                usernameInput.classList.add('is-invalid');
              }
            })
            .catch(error => {
              console.error('Error checking username:', error);
              feedback.textContent = 'Error checking username availability.';
              feedback.className = 'form-text text-danger mt-1 d-block';
            });
        }

        function checkEmail(email) {
          fetch(`/manager/api/check-email?email=${encodeURIComponent(email)}`)
            .then(response => response.json())
            .then(data => {
              if (data.available) {
                emailFeedback.textContent = 'Email is available!';
                emailFeedback.className = 'form-text text-success mt-1 fw-bold d-block';
                emailInput.classList.remove('is-invalid');
                emailInput.classList.add('is-valid');
              } else {
                emailFeedback.textContent = 'This email is already registered.';
                emailFeedback.className = 'form-text text-danger mt-1 fw-bold d-block';
                emailInput.classList.remove('is-valid');
                emailInput.classList.add('is-invalid');
              }
            })
            .catch(error => {
              console.error('Error checking email:', error);
              emailFeedback.textContent = 'Error checking email availability.';
              emailFeedback.className = 'form-text text-danger mt-1 d-block';
            });
        }
    });
  </script>
</body>

</html>
