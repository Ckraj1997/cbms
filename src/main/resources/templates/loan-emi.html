<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head}"></head>

<body>
  <div th:replace="~{fragments/navbar :: navbar}"></div>
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>

  <!-- Centered Focus Layout -->
  <div class="main-content d-flex flex-column align-items-center justify-content-center py-4" style="min-height: calc(100vh - 64px);">
    <div class="container" style="max-width: 600px">
      
      <!-- Premium EMI Calculator Card -->
      <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        
        <!-- Subtle gradient accent bar -->
        <div style="height: 6px; background: var(--brand-gradient);"></div>
        
        <div class="card-body p-4 p-md-5">
          
          <!-- Icon Header -->
          <div class="text-center mb-4 pb-2">
            <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
              <i class="bi bi-calculator fs-2"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">Loan EMI Calculator</h4>
            <p class="text-muted small">Estimate your monthly installments before applying for a loan.</p>
          </div>

          <form method="get" th:action="@{/loans/emi}">
            
            <!-- Loan Type -->
            <div class="mb-4">
              <label class="form-label text-muted fw-semibold small text-uppercase">Loan Product Type</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-briefcase"></i></span>
                <select class="form-select bg-light border-0 shadow-none ps-2" name="loanType" required>
                  <option value="" disabled selected>-- Select Loan Type --</option>
                  <option th:each="t : ${loanTypes}" th:selected="${t.loanType == selectedLoanType}" th:text="${t.loanType}" th:value="${t.loanType}"></option>
                </select>
              </div>
            </div>

            <!-- Loan Amount -->
            <div class="mb-4">
              <label class="form-label text-muted fw-semibold small text-uppercase">Loan Amount</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-0 text-muted fw-bold">₹</span>
                <input class="form-control bg-light border-0 shadow-none ps-2 font-monospace fw-bold text-primary" min="1000" name="amount" placeholder="Minimum ₹1,000" required step="100" th:value="${amount}" type="number" />
              </div>
            </div>

            <!-- Tenure -->
            <div class="mb-4">
              <label class="form-label text-muted fw-semibold small text-uppercase">Tenure (Months)</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-calendar-event"></i></span>
                <input class="form-control bg-light border-0 shadow-none ps-2" min="6" name="tenure" placeholder="Minimum 6 months" required th:value="${tenure}" type="number" />
              </div>
            </div>

            <!-- Calculate Action -->
            <button class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm mt-2" type="submit">
              Calculate EMI <i class="bi bi-arrow-right ms-2"></i>
            </button>
            
          </form>

          <!-- RESULT PROJECTION BOX -->
          <div class="bg-light rounded-4 p-4 mt-4 border border-light shadow-sm text-center" th:if="${emi != null}">
            <div class="row g-3 align-items-center">
              <div class="col-6 text-start border-end">
                <p class="text-muted small fw-semibold text-uppercase mb-1">Interest Rate</p>
                <h4 class="fw-bold text-dark mb-0"><span th:text="${rate}">0.0</span>% p.a.</h4>
              </div>
              <div class="col-6 text-end">
                <p class="text-muted small fw-semibold text-uppercase mb-1">Monthly EMI</p>
                <h3 class="fw-bold text-success mb-0">₹ <span th:text="${emi}">0.00</span></h3>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- Back Link -->
      <div class="text-center mt-4">
        <a class="text-decoration-none fw-medium text-muted hover-primary" th:href="@{/loans}">
          <i class="bi bi-arrow-left me-1"></i> Back to Loan List
        </a>
      </div>
      
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/app.js}"></script>
</body>

</html>
