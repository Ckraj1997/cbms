<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head}"></head>

<body>
  <div th:replace="~{fragments/navbar :: navbar}"></div>
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>

  <!-- Centered Focus Layout -->
  <div class="main-content d-flex flex-column align-items-center justify-content-center py-4" style="min-height: calc(100vh - 64px);">
    <div class="container" style="max-width: 600px">
      
      <!-- Alerts for Success/Error -->
      <div class="alert alert-danger alert-dismissible fade show border-0 shadow-sm rounded-4 mb-4" th:if="${error}">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
        <button class="btn-close" data-bs-dismiss="alert" type="button"></button>
      </div>
      <div class="alert alert-success alert-dismissible fade show border-0 shadow-sm rounded-4 mb-4" th:if="${success}">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
        <button class="btn-close" data-bs-dismiss="alert" type="button"></button>
      </div>

      <!-- Premium Loan Application Card -->
      <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        
        <!-- Subtle gradient accent bar -->
        <div style="height: 6px; background: var(--brand-gradient);"></div>
        
        <div class="card-body p-4 p-md-5">
          
          <!-- Icon Header -->
          <div class="text-center mb-4 pb-2">
            <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
              <i class="bi bi-cash-stack fs-2"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">Apply for Loan</h4>
            <p class="text-muted small">Select a loan product and submit your application for review.</p>
          </div>

          <form method="post" th:action="@{/loans/apply}">
            
            <!-- Loan Type -->
            <div class="mb-4">
              <label class="form-label text-muted fw-semibold small text-uppercase">Loan Product Type</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-briefcase"></i></span>
                <select class="form-select bg-light border-0 shadow-none ps-2" name="loanType" onchange="updateRate(this)" required>
                  <option disabled selected value="">-- Select Loan Type --</option>
                  <option th:data-rate="${r.interestRate}" th:each="r : ${rates}" th:text="${r.loanType}" th:value="${r.loanType}"></option>
                </select>
              </div>
            </div>

            <!-- Interest Rate Display -->
            <div class="mb-4">
              <label class="form-label text-muted fw-semibold small text-uppercase">Interest Rate (p.a.)</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-percent"></i></span>
                <input class="form-control bg-light border-0 shadow-none ps-2 font-monospace fw-bold text-success" id="rate" readonly type="text" placeholder="Select loan type above" />
              </div>
            </div>

            <!-- Disbursement Account -->
            <div class="mb-4">
              <label class="form-label text-muted fw-semibold small text-uppercase" for="accountId">Disbursement Account</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-wallet2"></i></span>
                <select class="form-select bg-light border-0 shadow-none ps-2 font-monospace" id="accountId" name="accountId" required>
                  <option value="" disabled selected>-- Select an account to receive funds --</option>
                  <option th:each="account : ${accounts}" th:value="${account.id}" th:text="${account.accountNumber + ' (' + account.accountType + ')'}"></option>
                </select>
              </div>
            </div>

            <!-- Loan Amount -->
            <div class="mb-4">
              <label class="form-label text-muted fw-semibold small text-uppercase">Loan Amount</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-0 text-muted fw-bold">₹</span>
                <input class="form-control bg-light border-0 shadow-none ps-2 font-monospace fw-bold text-primary" min="1000" name="amount" placeholder="Minimum ₹1,000" required step="100" type="number" />
              </div>
            </div>

            <!-- Tenure -->
            <div class="mb-4">
              <label class="form-label text-muted fw-semibold small text-uppercase">Tenure (Months)</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-calendar-event"></i></span>
                <input class="form-control bg-light border-0 shadow-none ps-2" min="6" name="tenureMonths" placeholder="Minimum 6 months" required type="number" />
              </div>
            </div>

            <!-- Submit Action -->
            <button class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm mt-3" type="submit">
              Submit Application <i class="bi bi-arrow-right ms-2"></i>
            </button>
            
          </form>
        </div>
      </div>

      <!-- Back Link -->
      <div class="text-center mt-4">
        <a class="text-decoration-none fw-medium text-muted hover-primary" th:href="@{/loans}">
          <i class="bi bi-arrow-left me-1"></i> Back to Loan List
        </a>
      </div>
      
    </div>
  </div>

  <!-- Dynamic Rate Script -->
  <script>
    function updateRate(sel) {
      const selectedOption = sel.options[sel.selectedIndex];
      const rate = selectedOption.dataset.rate;
      document.getElementById("rate").value = rate ? rate + "%" : "";
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/app.js}"></script>
</body>

</html>
