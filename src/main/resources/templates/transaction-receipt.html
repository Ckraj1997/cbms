<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head}"></head>

<body>
  <div th:replace="~{fragments/navbar :: navbar}"></div>
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>

  <!-- Centered Focus Layout -->
  <div class="main-content d-flex flex-column align-items-center justify-content-center py-4" style="min-height: calc(100vh - 64px);">
    <div class="container" style="max-width: 600px">
      
      <!-- Premium Receipt Card -->
      <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        
        <!-- Subtle gradient accent bar -->
        <div style="height: 6px; background: var(--brand-gradient);"></div>
        
        <div class="card-body p-4 p-md-5 text-center">
          
          <!-- Success Icon Header -->
          <div class="mb-4">
            <div class="bg-success bg-opacity-10 text-success rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 80px; height: 80px;">
              <i class="bi bi-check-circle-fill fs-1"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Transaction Successful!</h3>
            <p class="text-muted small">Your funds have been transferred successfully.</p>
          </div>

          <!-- Receipt Details Box -->
          <div class="bg-light rounded-4 p-4 mb-4 border border-light shadow-sm text-start">
            <table class="table table-borderless align-middle mb-0">
              
              <tr>
                <td class="text-muted small fw-semibold text-uppercase py-2">From Account</td>
                <td class="text-end fw-bold font-monospace text-dark py-2" th:text="${receipt.debitTransaction.account.accountNumber}">ACC-12345</td>
              </tr>

              <tr>
                <td class="text-muted small fw-semibold text-uppercase py-2">To Account</td>
                <td class="text-end fw-bold font-monospace text-dark py-2" th:text="${receipt.creditTransaction.account.accountNumber}">ACC-67890</td>
              </tr>

              <tr>
                <td class="text-muted small fw-semibold text-uppercase py-2">Transfer Amount</td>
                <td class="text-end fw-bold text-success font-monospace py-2 fs-5">
                  ₹ <span th:text="${#numbers.formatDecimal(receipt.debitTransaction.amount, 1, 'COMMA', 2, 'POINT')}">0.00</span>
                </td>
              </tr>

              <tr>
                <td class="text-muted small fw-semibold text-uppercase py-2">Timestamp</td>
                <td class="text-end text-dark font-monospace small py-2" th:text="${#temporals.format(receipt.debitTransaction.transactionTime, 'dd MMM yyyy, HH:mm')}">Date</td>
              </tr>

              <tr>
                <td class="text-muted small fw-semibold text-uppercase pt-2">Status</td>
                <td class="text-end pt-2">
                  <span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 rounded-pill px-3 py-1 fw-semibold">SUCCESS</span>
                </td>
              </tr>

            </table>
          </div>

          <!-- Action Buttons -->
          <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center">
            <a class="btn btn-light border text-dark rounded-pill fw-medium px-4 py-3 shadow-sm flex-fill" th:href="@{/dashboard}">
              <i class="bi bi-house-door me-1"></i> Dashboard
            </a>
            <a class="btn btn-primary rounded-pill fw-bold px-4 py-3 shadow-sm flex-fill" th:href="@{/transactions}">
              <i class="bi bi-receipt me-1"></i> View Transactions
            </a>
          </div>

        </div>
      </div>
      
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/app.js}"></script>
</body>

</html>
