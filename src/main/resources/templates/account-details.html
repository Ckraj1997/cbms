<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head}"></head>

<body>
  <div th:replace="~{fragments/navbar :: navbar}"></div>
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>

  <div class="main-content">
    <div class="container mt-4" style="max-width: 650px;">
      
      <!-- Page Header & Back Button -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold text-dark mb-0">Account Details</h4>
        <a class="btn btn-sm btn-light rounded-pill fw-medium px-3 border shadow-sm" th:href="@{/accounts}">
          <i class="bi bi-arrow-left me-1"></i> Back
        </a>
      </div>

      <!-- Main Account Card -->
      <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-4">
        <!-- Subtle gradient accent bar at the top -->
        <div style="height: 6px; background: var(--brand-gradient);"></div>
        
        <div class="card-body p-4 p-md-5">
          <div class="d-flex justify-content-between align-items-start mb-4">
            <div>
              <p class="text-muted small fw-bold text-uppercase mb-1" th:text="${account.accountType}">SAVINGS</p>
              <h3 class="fw-bold text-dark font-monospace mb-0" th:text="${account.accountNumber}">ACC-XXXXXX</h3>
            </div>
            
            <!-- Dynamic Status Badge -->
            <span class="badge rounded-pill fw-semibold px-3 py-2" 
                  th:classappend="${account.status == 'ACTIVE'} ? 'bg-success bg-opacity-10 text-success' : (${account.status == 'PENDING'} ? 'bg-warning bg-opacity-10 text-warning-emphasis' : 'bg-danger bg-opacity-10 text-danger')" 
                  th:text="${account.status}">
            </span>
          </div>

          <div class="p-4 bg-light rounded-4 border border-light shadow-sm">
            <p class="text-muted small fw-semibold text-uppercase mb-1">Available Balance</p>
            <h1 class="text-success fw-bold mb-0">
              ₹ <span th:text="${#numbers.formatDecimal(account.balance, 1, 'COMMA', 2, 'POINT')}">0.00</span>
            </h1>
          </div>
        </div>
      </div>

      <!-- Quick Actions (Only visible if ACTIVE) -->
      <div th:if="${account.status == 'ACTIVE'}">
        <h6 class="fw-bold text-muted mb-3 px-1">Quick Actions</h6>
        <div class="row g-3">
          <div class="col-sm-6">
            <a class="card border-0 shadow-sm rounded-4 text-decoration-none hover-scale h-100" th:href="@{/transactions(accountId=${account.id})}">
              <div class="card-body p-3 d-flex align-items-center">
                <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 42px; height: 42px;">
                  <i class="bi bi-list-ul fs-5"></i>
                </div>
                <div>
                  <h6 class="fw-bold text-dark mb-0">Transactions</h6>
                  <small class="text-muted">View history</small>
                </div>
              </div>
            </a>
          </div>
          <div class="col-sm-6">
            <a class="card border-0 shadow-sm rounded-4 text-decoration-none hover-scale h-100" th:href="@{/accounts/interest/{id}(id=${account.id})}">
              <div class="card-body p-3 d-flex align-items-center">
                <div class="bg-success bg-opacity-10 text-success rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 42px; height: 42px;">
                  <i class="bi bi-graph-up-arrow fs-5"></i>
                </div>
                <div>
                  <h6 class="fw-bold text-dark mb-0">Interest</h6>
                  <small class="text-muted">Calculate yields</small>
                </div>
              </div>
            </a>
          </div>
        </div>
      </div>

      <!-- Pending Alert -->
      <div class="alert bg-warning bg-opacity-10 border border-warning border-opacity-25 rounded-4 d-flex align-items-center p-4 mt-4 shadow-sm" th:if="${account.status == 'PENDING'}">
        <i class="bi bi-clock-history fs-2 text-warning me-3"></i>
        <div>
          <h6 class="fw-bold text-warning-emphasis mb-1">Activation Pending</h6>
          <p class="mb-0 small text-dark opacity-75">This account is currently pending administrative approval. Transactions will be enabled once verified.</p>
        </div>
      </div>

    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/app.js}"></script>
</body>

</html>
