<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head}"></head>

<body>
  <div th:replace="~{fragments/navbar :: navbar}"></div>
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>

  <!-- Centered Focus Layout -->
  <div class="main-content d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 64px);">
    <div class="container" style="max-width: 550px">
      
      <!-- Premium Card Design -->
      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4 p-md-5">
          
          <!-- Icon Header -->
          <div class="text-center mb-4">
            <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
              <i class="bi bi-person-plus fs-2"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">Add Beneficiary</h4>
            <p class="text-muted small">Register a new payee for secure fund transfers.</p>
          </div>

          <form method="post" th:action="@{/beneficiaries/add}" th:object="${beneficiary}">
            
            <!-- Beneficiary Name -->
            <div class="mb-4">
              <label class="form-label text-muted fw-semibold small text-uppercase">Beneficiary Name</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-person"></i></span>
                <input class="form-control bg-light border-0 shadow-none ps-2" placeholder="Full Legal Name" required th:field="*{beneficiaryName}" type="text" />
              </div>
            </div>

            <!-- Account Number -->
            <div class="mb-4">
              <label class="form-label text-muted fw-semibold small text-uppercase">Account Number</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-123"></i></span>
                <input class="form-control bg-light border-0 shadow-none ps-2 font-monospace text-dark" placeholder="e.g. 0987654321" required th:field="*{beneficiaryAccountNumber}" type="text" />
              </div>
            </div>

            <!-- Bank Name -->
            <div class="mb-4">
              <label class="form-label text-muted fw-semibold small text-uppercase">Bank Name</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-bank"></i></span>
                <input class="form-control bg-light border-0 shadow-none ps-2" placeholder="e.g. FinCore Bank" required th:field="*{bankName}" type="text" />
              </div>
            </div>

            <!-- Future Implementation Note -->
            <!-- 
            <div class="mb-4">
              <label class="form-label text-muted fw-semibold small text-uppercase">IFSC Code</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-hash"></i></span>
                <input class="form-control bg-light border-0 shadow-none ps-2 text-uppercase font-monospace" th:field="*{ifsc}" required type="text" />
              </div>
            </div> 
            -->

            <!-- Security Alert -->
            <div class="alert bg-info bg-opacity-10 text-info border-0 rounded-3 d-flex align-items-start p-3 mb-4 shadow-none">
              <i class="bi bi-shield-lock-fill fs-5 me-3 mt-1"></i>
              <small class="fw-medium text-dark opacity-75">For your security, this beneficiary will require administrative approval before transfers can be initiated.</small>
            </div>

            <button class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm mt-2" type="submit">
              Submit Request <i class="bi bi-arrow-right ms-2"></i>
            </button>
          </form>
        </div>
      </div>

      <!-- Back Link -->
      <div class="text-center mt-4">
        <a class="text-decoration-none fw-medium text-muted hover-primary" th:href="@{/beneficiaries}">
          <i class="bi bi-arrow-left me-1"></i> Back to Beneficiaries
        </a>
      </div>
      
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/app.js}"></script>
</body>

</html>
