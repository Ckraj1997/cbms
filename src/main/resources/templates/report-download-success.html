<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head}"></head>

<body>
  <div th:replace="~{fragments/navbar :: navbar}"></div>
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>

  <!-- Centered Focus Layout -->
  <div class="main-content d-flex flex-column align-items-center justify-content-center py-4" style="min-height: calc(100vh - 64px);">
    <div class="container" style="max-width: 600px">
      
      <!-- Premium Success Card -->
      <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        
        <!-- Subtle gradient accent bar -->
        <div style="height: 6px; background: var(--brand-gradient);"></div>
        
        <div class="card-body p-4 p-md-5 text-center">
          
          <!-- Success Icon Header -->
          <div class="mb-4">
            <div class="bg-success bg-opacity-10 text-success rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 80px; height: 80px;">
              <i class="bi bi-file-earmark-check-fill fs-1"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Report Generated Successfully!</h3>
            <p class="text-muted small">Your requested compliance or audit report is ready for export.</p>
          </div>

          <!-- Report Type Callout -->
          <div class="bg-light rounded-4 p-4 mb-4 border border-light shadow-sm text-center">
            <p class="text-muted small fw-semibold text-uppercase mb-1">Document Profile</p>
            <h5 class="fw-bold text-dark mb-3" th:text="${reportType}">Audit & Compliance Report</h5>
            
            <hr class="text-muted opacity-25 my-3" />
            
            <div class="d-flex justify-content-between align-items-center px-2">
              <span class="text-muted small fw-semibold text-uppercase">Timestamp</span>
              <span class="text-dark font-monospace small fw-medium" th:text="${#temporals.format(generatedDate, 'dd MMM yyyy, HH:mm:ss')}">01 Jan 2026, 12:00:00</span>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center">
            <a class="btn btn-light border text-dark rounded-pill fw-medium px-4 py-3 shadow-sm flex-fill" th:href="@{/dashboard}">
              <i class="bi bi-house-door me-1"></i> Return to Dashboard
            </a>
            <a class="btn btn-primary rounded-pill fw-bold px-4 py-3 shadow-sm flex-fill" th:href="@{/compliance/audit/download}">
              <i class="bi bi-download me-1"></i> Download Report
            </a>
          </div>

        </div>
      </div>
      
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/app.js}"></script>
</body>

</html>
