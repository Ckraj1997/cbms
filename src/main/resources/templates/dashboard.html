<!doctype html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head}"></head>

<body>
  <div th:replace="~{fragments/navbar :: navbar}"></div>
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>

  <div class="main-content">
    <div class="container-fluid mt-2 px-md-4">
      
      <!-- Dynamic Page Header based on Role -->
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 pb-3 border-bottom">
        <div class="mb-3 mb-md-0">
          
          <h4 class="fw-bold text-dark mb-1" th:if="${userRole == 'ROLE_CUSTOMER'}">
            <i class="bi bi-grid-1x2 text-primary me-2"></i> My Dashboard
          </h4>
          <h4 class="fw-bold text-dark mb-1" th:if="${userRole == 'ROLE_ADMIN'}">
            <i class="bi bi-shield-lock text-primary me-2"></i> System Administration
          </h4>
          <h4 class="fw-bold text-dark mb-1" th:if="${userRole == 'ROLE_TELLER'}">
            <i class="bi bi-pc-display text-primary me-2"></i> Teller Workspace
          </h4>
          <h4 class="fw-bold text-dark mb-1" th:if="${userRole == 'ROLE_MANAGER'}">
            <i class="bi bi-briefcase text-primary me-2"></i> Branch Manager Overview
          </h4>
          <h4 class="fw-bold text-dark mb-1" th:if="${userRole == 'ROLE_COMPLIANCE'}">
            <i class="bi bi-clipboard-check text-primary me-2"></i> Compliance Monitor
          </h4>
          <h4 class="fw-bold text-dark mb-1" th:if="${userRole == 'ROLE_RELATIONSHIP_MGR'}">
            <i class="bi bi-graph-up text-primary me-2"></i> Portfolio Dashboard
          </h4>
          <h4 class="fw-bold text-danger mb-1" th:if="${userRole == 'ROLE_SUPER_ADMIN'}">
            <i class="bi bi-cpu-fill text-danger me-2"></i> Central IT Command Center
          </h4>
          
          <p class="text-muted small mb-0">Welcome back to your FinCore workspace.</p>
        </div>
        
        <!-- Premium Role Badge -->
        <div>
          <span class="badge rounded-pill bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25 px-3 py-2 fw-semibold shadow-sm" th:text="${userRole}">
            ROLE
          </span>
        </div>
      </div>

      <!-- ========================================== -->
      <!-- DYNAMIC DASHBOARD INJECTIONS               -->
      <!-- ========================================== -->
      
      <div sec:authorize="hasRole('ROLE_CUSTOMER')">
        <div th:replace="~{fragments/dashboard-views :: customer-dashboard}"></div>
      </div>

      <div sec:authorize="hasRole('ROLE_ADMIN')">
        <div th:replace="~{fragments/dashboard-views :: admin-dashboard}"></div>
      </div>

      <div sec:authorize="hasRole('ROLE_TELLER')">
        <div th:replace="~{fragments/dashboard-views :: teller-dashboard}"></div>
      </div>

      <div sec:authorize="hasRole('ROLE_MANAGER')">
        <div th:replace="~{fragments/dashboard-views :: manager-dashboard}"></div>
      </div>

      <div sec:authorize="hasAnyRole('ROLE_COMPLIANCE', 'ROLE_AUDITOR')">
        <div th:replace="~{fragments/dashboard-views :: compliance-dashboard}"></div>
      </div>

      <div sec:authorize="hasRole('ROLE_RELATIONSHIP_MGR')">
        <div th:replace="~{fragments/dashboard-views :: rm-dashboard}"></div>
      </div>

      <div sec:authorize="hasRole('ROLE_SUPER_ADMIN')">
        <div th:replace="~{fragments/dashboard-views :: super-admin-dashboard}"></div>
      </div>
      
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/app.js}"></script>
</body>

</html>
