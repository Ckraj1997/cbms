<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head}"></head>

<body>
  <div th:replace="~{fragments/navbar :: navbar}"></div>
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>

  <!-- Centered Focus Layout -->
  <div class="main-content d-flex flex-column align-items-center justify-content-center py-4" style="min-height: calc(100vh - 64px);">
    <div class="container" style="max-width: 600px">
      
      <!-- Error Alert -->
      <div class="alert alert-danger alert-dismissible fade show border-0 shadow-sm rounded-4 mb-4" th:if="${error}">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
        <button class="btn-close" data-bs-dismiss="alert" type="button"></button>
      </div>

      <!-- Premium FD Card -->
      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4 p-md-5">
          
          <!-- Icon Header -->
          <div class="text-center mb-4 pb-2">
            <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
              <i class="bi bi-safe2-fill fs-2"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">Open Fixed Deposit</h4>
            <p class="text-muted small">Secure your future with high-interest, risk-free returns.</p>
          </div>

          <form method="post" th:action="@{/investments/create}">
            
            <!-- Source Account -->
            <div class="mb-4">
              <label class="form-label text-muted fw-semibold small text-uppercase">Source Account</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-wallet2"></i></span>
                <select class="form-select bg-light border-0 shadow-none ps-2 font-monospace" name="accountNumber" required>
                  <option disabled selected th:if="${#lists.isEmpty(accounts)}" value="">No active account found</option>
                  <option disabled selected th:if="${!#lists.isEmpty(accounts)}" value="">-- Select Source Account --</option>
                  <option th:each="acc : ${accounts}" th:text="${acc.accountNumber} + ' (Bal: ₹' + ${acc.balance} + ')'" th:value="${acc.accountNumber}"></option>
                </select>
              </div>
              <div class="form-text small text-muted mt-2">
                <i class="bi bi-info-circle me-1"></i> Funds will be debited from this account instantly.
              </div>
            </div>

            <!-- Investment Amount -->
            <div class="mb-4">
              <label class="form-label text-muted fw-semibold small text-uppercase">Investment Amount</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-0 text-muted fw-bold">₹</span>
                <input class="form-control bg-light border-0 shadow-none ps-2 font-monospace fw-bold text-primary" id="amount" min="1000" name="amount" oninput="calculateReturns()" placeholder="Minimum ₹1,000" required type="number" />
              </div>
            </div>

            <!-- Tenure -->
            <div class="mb-4">
              <label class="form-label text-muted fw-semibold small text-uppercase">Tenure</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-calendar-event"></i></span>
                <select class="form-select bg-light border-0 shadow-none ps-2" id="tenure" name="tenure" onchange="calculateReturns()" required>
                  <option value="6">6 Months (5.5% p.a.)</option>
                  <option selected value="12">12 Months (7.5% p.a.)</option>
                  <option value="24">24 Months (7.5% p.a.)</option>
                  <option value="36">36 Months (7.5% p.a.)</option>
                  <option value="60">60 Months (7.5% p.a.)</option>
                </select>
              </div>
            </div>

            <!-- Dynamic Projection Box -->
            <div class="bg-light rounded-4 p-4 mb-4 border border-light shadow-sm">
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <p class="text-muted small fw-semibold text-uppercase mb-1">Estimated Maturity</p>
                  <h3 class="fw-bold text-success mb-0" id="previewAmount">₹ 0.00</h3>
                </div>
                <div class="text-end">
                  <p class="text-muted small fw-semibold text-uppercase mb-1">Interest Rate</p>
                  <span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 px-3 py-2 fs-6 fw-bold" id="previewRate">7.5%</span>
                </div>
              </div>
            </div>

            <!-- Submit Action -->
            <button class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm mt-2" type="submit">
              Create Fixed Deposit <i class="bi bi-check2-circle ms-2"></i>
            </button>
            
          </form>
        </div>
      </div>

      <!-- Back Link -->
      <div class="text-center mt-4">
        <a class="text-decoration-none fw-medium text-muted hover-primary" th:href="@{/investments}">
          <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
        </a>
      </div>
      
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/app.js}"></script>

  <!-- Real-time Returns Calculator -->
  <script>
    function calculateReturns() {
      const amount = parseFloat(document.getElementById("amount").value) || 0;
      const tenure = parseInt(document.getElementById("tenure").value) || 12;

      let rate = tenure >= 12 ? 7.5 : 5.5;

      const r = rate / 100;
      const n = 4; // Compounded quarterly
      const t = tenure / 12.0;

      const maturityAmount = amount * Math.pow(1 + r / n, n * t);

      // Add comma formatting for better readability
      const formattedAmount = maturityAmount.toLocaleString('en-IN', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });

      document.getElementById("previewAmount").innerText = "₹ " + formattedAmount;
      document.getElementById("previewRate").innerText = rate + "%";
    }
  </script>
</body>

</html>
