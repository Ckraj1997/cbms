<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head}"></head>

<body>
  <div th:replace="~{fragments/navbar :: navbar}"></div>
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>

  <div class="main-content">
    <div class="container-fluid mt-2 px-md-4">
      
      <!-- Alerts for Success/Error -->
      <div class="alert alert-success alert-dismissible fade show border-0 shadow-sm rounded-3 mb-4" th:if="${success}">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
        <button class="btn-close" data-bs-dismiss="alert" type="button"></button>
      </div>
      <div class="alert alert-danger alert-dismissible fade show border-0 shadow-sm rounded-3 mb-4" th:if="${error}">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
        <button class="btn-close" data-bs-dismiss="alert" type="button"></button>
      </div>

      <!-- Page Header -->
      <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
        <div>
          <h4 class="fw-bold text-dark mb-1">
            <i class="bi bi-terminal-fill text-danger me-2"></i> SQL Console
          </h4>
          <p class="text-muted small mb-0">Direct database query execution tool restricted to Super-Admin privileges.</p>
        </div>
        <a class="btn btn-light border text-dark rounded-pill fw-medium shadow-sm px-4" th:href="@{/super-admin}">
          <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
        </a>
      </div>

      <!-- Query Input Card -->
      <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-4">
        
        <!-- Subtle gradient accent bar -->
        <div style="height: 6px; background: var(--brand-gradient);"></div>
        
        <div class="card-body p-4 p-md-5">
          <form method="post" th:action="@{/super-admin/sql/execute}">
            
            <div class="mb-4">
              <label class="form-label text-muted fw-semibold small text-uppercase">SQL Query Editor</label>
              <div class="position-relative">
                <textarea class="form-control font-monospace bg-light border-0 rounded-4 p-3 shadow-none text-dark" 
                          name="query" 
                          placeholder="SELECT * FROM users;" 
                          required rows="6" 
                          th:text="${lastQuery}"></textarea>
              </div>
              <div class="form-text small text-muted mt-2">
                <i class="bi bi-info-circle me-1"></i> Supported Operations: <code class="text-danger">SELECT</code>, <code class="text-danger">UPDATE</code>, <code class="text-danger">DELETE</code>, <code class="text-danger">INSERT</code>. Exercise extreme caution.
              </div>
            </div>

            <button class="btn btn-danger btn-lg rounded-pill fw-bold shadow-sm px-5" type="submit">
              <i class="bi bi-play-fill me-1"></i> Execute Query
            </button>
            
          </form>
        </div>
      </div>

      <!-- Query Results Card -->
      <div class="card border-0 shadow-sm rounded-4 overflow-hidden" th:if="${results}">
        <div class="card-header bg-dark text-white px-4 py-3 d-flex justify-content-between align-items-center border-0">
          <span class="fw-bold small text-uppercase tracking-wider">
            <i class="bi bi-table me-2 text-info"></i> Query Execution Results
          </span>
          <span class="badge bg-secondary bg-opacity-25 text-light border border-secondary border-opacity-50 rounded-pill px-3 py-1 font-monospace small">
            Rows Returned: <span th:text="${results.size()}">0</span>
          </span>
        </div>

        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle table-sm mb-0 font-monospace text-nowrap">
              <thead class="bg-light">
                <tr>
                  <th class="border-0 px-4 py-3 text-muted small fw-bold text-uppercase" th:each="col : ${columns}" th:text="${col}">Column</th>
                </tr>
              </thead>
              <tbody class="border-top-0">
                <tr th:each="row : ${results}">
                  <td class="px-4 py-3 text-dark small" th:each="entry : ${row.entrySet()}" th:text="${entry.value}">value</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/app.js}"></script>
</body>

</html>
