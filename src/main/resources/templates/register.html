<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head}"></head>

<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
  
  <div class="container d-flex justify-content-center align-items-center py-5">
    <div class="card border-0 shadow-lg rounded-4 overflow-hidden" style="width: 100%; max-width: 800px;">
      
      <!-- Subtle gradient accent bar -->
      <div style="height: 6px; background: var(--brand-gradient);"></div>
      
      <div class="card-body p-4 p-md-5">
        
        <!-- Header -->
        <div class="text-center mb-4 pb-2">
          <img alt="FinCore Logo" class="img-fluid mx-auto d-block mb-3" style="max-width: 64px;" th:src="@{/images/logo.png}" />
          <h3 class="fw-bold text-dark mb-1">FinCore Banking</h3>
          <p class="text-muted small">Create your secure customer profile to get started.</p>
        </div>

        <!-- Error Alert -->
        <div class="alert bg-danger bg-opacity-10 text-danger border-0 rounded-3 d-flex align-items-center p-3 mb-4 shadow-none" th:if="${error}">
          <i class="bi bi-exclamation-triangle-fill fs-5 me-2"></i>
          <span class="small fw-medium" th:text="${error}"></span>
        </div>

        <form method="post" th:action="@{/register}" th:object="${user}">
          
          <div class="row g-3">
            <!-- First Name -->
            <div class="col-md-6 mb-2">
              <label class="form-label text-muted fw-semibold small text-uppercase">First Name</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-person"></i></span>
                <input class="form-control bg-light border-0 shadow-none ps-2" placeholder="Enter first name" required th:field="*{firstName}" type="text" />
              </div>
            </div>

            <!-- Last Name -->
            <div class="col-md-6 mb-2">
              <label class="form-label text-muted fw-semibold small text-uppercase">Last Name</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-person-fill"></i></span>
                <input class="form-control bg-light border-0 shadow-none ps-2" placeholder="Enter last name" required th:field="*{lastName}" type="text" />
              </div>
            </div>

            <!-- Username -->
            <div class="col-md-6 mb-2">
              <label class="form-label text-muted fw-semibold small text-uppercase">Username</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-at"></i></span>
                <input class="form-control bg-light border-0 shadow-none ps-2" placeholder="Choose a username" required th:field="*{username}" type="text" />
              </div>
            </div>

            <!-- Email -->
            <div class="col-md-6 mb-2">
              <label class="form-label text-muted fw-semibold small text-uppercase">Email Address</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-envelope"></i></span>
                <input class="form-control bg-light border-0 shadow-none ps-2" placeholder="name@example.com" required th:field="*{email}" type="email" />
              </div>
            </div>

            <!-- Mobile -->
            <div class="col-md-6 mb-2">
              <label class="form-label text-muted fw-semibold small text-uppercase">Mobile Number</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-phone"></i></span>
                <input class="form-control bg-light border-0 shadow-none ps-2 font-monospace" placeholder="10-digit mobile number" required th:field="*{phone}" type="tel" />
              </div>
            </div>

            <!-- Address -->
            <div class="col-md-6 mb-2">
              <label class="form-label text-muted fw-semibold small text-uppercase">Residential Address</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-geo-alt"></i></span>
                <input class="form-control bg-light border-0 shadow-none ps-2" placeholder="Street address, city" required th:field="*{address}" type="text" />
              </div>
            </div>

            <!-- Password -->
            <div class="col-md-6 mb-3">
              <label class="form-label text-muted fw-semibold small text-uppercase">Password</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-lock"></i></span>
                <input class="form-control bg-light border-0 shadow-none ps-2" placeholder="Create password" required th:field="*{password}" type="password" />
              </div>
            </div>

            <!-- Confirm Password -->
            <div class="col-md-6 mb-3">
              <label class="form-label text-muted fw-semibold small text-uppercase">Confirm Password</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-shield-lock"></i></span>
                <input class="form-control bg-light border-0 shadow-none ps-2" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" required type="password" />
              </div>
            </div>
          </div>

          <!-- Buttons -->
          <div class="d-grid mt-3">
            <button class="btn btn-primary btn-lg rounded-pill fw-bold shadow-sm py-3" type="submit">
              <i class="bi bi-person-plus-fill me-2"></i> Create Account
            </button>
          </div>
        </form>

        <hr class="text-muted opacity-25 my-4" />

        <div class="text-center">
          <span class="text-muted small">Already have an account?</span>
          <a class="fw-semibold text-decoration-none ms-1" th:href="@{/login}">
            Login Here
          </a>
        </div>

        <!-- Security Footer Note -->
        <div class="text-center mt-4">
          <small class="text-muted fw-medium">
            <i class="bi bi-shield-lock-fill text-success me-1"></i> Secure 256-bit Encrypted Portal
          </small>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/app.js}"></script>
</body>

</html>
