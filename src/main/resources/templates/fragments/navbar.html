<!doctype html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
<body>
  <!-- Upgraded to a sleek white navbar with a subtle shadow -->
  <nav class="navbar bg-white shadow-sm px-4 border-bottom" style="height: 64px; z-index: 1050; position: sticky; top: 0;" th:fragment="navbar">
    <!-- LEFT: Toggle & Brand -->
    <div class="d-flex align-items-center">
      <button class="btn btn-link text-dark p-0 me-3 fs-4 text-decoration-none" onclick="toggleSidebar()" id="sidebarToggle">
        <i class="bi bi-list"></i>
      </button>
      <a class="navbar-brand d-flex align-items-center fw-bold" th:href="@{/dashboard}" style="color: #4c1d95; letter-spacing: -0.5px;">
        <!-- Integrated your new logo -->
        <img th:src="@{/images/logo.png}" alt="CBMS Logo" height="36" class="me-2 rounded">
        <span class="d-none d-sm-inline">FinCore</span>
      </a>
    </div>
    <!-- RIGHT: User Profile & Actions -->
    <div class="ms-auto d-flex align-items-center">
      <!-- Notification Bell (Now Clickable) -->
      <a class="btn btn-link text-secondary me-3 position-relative p-0 border-0 fs-5 text-decoration-none" th:href="@{/notifications}">
        <i class="bi bi-bell"></i>
        <!-- Red dot indicator for alerts -->
        <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle">
          <span class="visually-hidden">New alerts</span>
        </span>
      </a>
      <!-- User Profile Badge -->
      <div class="d-flex align-items-center bg-light rounded-pill px-3 py-1 me-3 border">
        <i class="bi bi-person-circle fs-5 text-primary me-2"></i>
        <span class="fw-medium text-dark" sec:authentication="name" style="font-size: 14px;"></span>
      </div>
      <!-- Modern Logout Button -->
      <a class="btn btn-outline-danger btn-sm rounded-pill px-3 fw-medium d-flex align-items-center" th:href="@{/logout}">
        <i class="bi bi-box-arrow-right me-1"></i> <span class="d-none d-sm-inline">Logout</span>
      </a>
    </div>
  </nav>
</body>
</html>
