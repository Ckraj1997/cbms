<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head}"></head>

<body>
  <div th:replace="~{fragments/navbar :: navbar}"></div>
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>

  <div class="main-content">
    <div class="container-fluid mt-2 px-md-4">
      
      <!-- Alerts for Success/Error Actions -->
      <div class="alert alert-success alert-dismissible fade show border-0 shadow-sm rounded-3 mb-4" th:if="${success}">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
        <button class="btn-close" data-bs-dismiss="alert" type="button"></button>
      </div>
      <div class="alert alert-danger alert-dismissible fade show border-0 shadow-sm rounded-3 mb-4" th:if="${error}">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
        <button class="btn-close" data-bs-dismiss="alert" type="button"></button>
      </div>

      <!-- Page Header -->
      <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
        <div>
          <h4 class="fw-bold text-dark mb-1">
            <i class="bi bi-ui-checks text-primary me-2"></i> Service Request Fulfillment
          </h4>
          <p class="text-muted small mb-0">Review and authorize customer requests for cheque books, debit cards, and banking services.</p>
        </div>
      </div>

      <!-- Data Table Card -->
      <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle text-nowrap mb-0">
              <thead class="bg-light">
                <tr>
                  <th class="border-0 px-4 py-3 text-muted small fw-bold text-uppercase">Req ID</th>
                  <th class="border-0 px-4 py-3 text-muted small fw-bold text-uppercase">Customer Details</th>
                  <th class="border-0 px-4 py-3 text-muted small fw-bold text-uppercase">Request Type</th>
                  <th class="border-0 px-4 py-3 text-muted small fw-bold text-uppercase">Date Requested</th>
                  <th class="border-0 px-4 py-3 text-muted small fw-bold text-uppercase text-end">Action</th>
                </tr>
              </thead>
              <tbody class="border-top-0">
                
                <!-- Service Request Row -->
                <tr th:each="req : ${requests}">
                  <td class="px-4 py-3 font-monospace text-muted small">
                    <span class="fw-bold text-dark" th:text="'#SR-' + ${req.id}">#SR-101</span>
                  </td>

                  <td class="px-4 py-3">
                    <div class="d-flex align-items-center">
                      <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 38px; height: 38px;">
                        <i class="bi bi-person-fill"></i>
                      </div>
                      <div>
                        <span class="d-block fw-bold text-dark" th:text="${req.account.user.username}">User</span>
                        <small class="text-muted" th:text="${req.account.user.email}">user@bank.com</small>
                      </div>
                    </div>
                  </td>

                  <td class="px-4 py-3">
                    <span class="badge rounded-pill px-3 py-2 fw-semibold" 
                          th:classappend="${req.requestType == 'CHEQUE_BOOK'} ? 'bg-info bg-opacity-10 text-info-emphasis border border-info border-opacity-25' : 'bg-warning bg-opacity-10 text-warning-emphasis border border-warning border-opacity-25'"
                          th:text="${req.requestType}">
                      CHEQUE_BOOK
                    </span>
                  </td>

                  <td class="px-4 py-3">
                    <span class="text-muted small fw-medium" th:text="${#temporals.format(req.requestDate, 'dd MMM yyyy, HH:mm')}">Date</span>
                  </td>

                  <td class="px-4 py-3 text-end">
                    <div class="d-flex gap-2 justify-content-end">
                      <form method="post" th:action="@{/manager/services/approve}" class="m-0">
                        <input name="id" th:value="${req.id}" type="hidden" />
                        <button class="btn btn-success btn-sm rounded-pill px-3 fw-bold shadow-sm" onclick="return confirm('Approve and process this service request immediately?');" type="submit">
                          <i class="bi bi-check-lg me-1"></i> Process
                        </button>
                      </form>

                      <form method="post" th:action="@{/manager/services/reject}" class="m-0">
                        <input name="id" th:value="${req.id}" type="hidden" />
                        <button class="btn btn-light text-danger border btn-sm rounded-pill px-3 fw-medium shadow-sm" onclick="return confirm('Reject this request?');" type="submit">
                          <i class="bi bi-x-lg me-1"></i> Reject
                        </button>
                      </form>
                    </div>
                  </td>
                </tr>

                <!-- Empty State -->
                <tr th:if="${#lists.isEmpty(requests)}">
                  <td colspan="5" class="text-center py-5">
                    <div class="bg-light rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px;">
                      <i class="bi bi-inbox display-5 text-success opacity-75"></i>
                    </div>
                    <h5 class="fw-bold text-dark">All Clear!</h5>
                    <p class="text-muted mb-0">There are no pending service requests requiring fulfillment.</p>
                  </td>
                </tr>

              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/app.js}"></script>
</body>

</html>
