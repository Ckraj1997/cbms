<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head}"></head>

<body>
  <div th:replace="~{fragments/navbar :: navbar}"></div>
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>

  <!-- Used flexbox to perfectly center the form on the screen -->
  <div class="main-content d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 64px);">
    <div class="container" style="max-width: 550px">
      
      <!-- Premium Card Design -->
      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-5">
          
          <!-- Icon Header -->
          <div class="text-center mb-4">
            <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
              <i class="bi bi-wallet2 fs-2"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">Open New Account</h4>
            <p class="text-muted small">Submit a request to open a new banking account.</p>
          </div>

          <form method="post" th:action="@{/accounts/create}" th:object="${account}">
            
            <!-- Account Type -->
            <div class="mb-4">
              <label class="form-label text-muted fw-semibold small text-uppercase">Account Type</label>
              <select class="form-select form-select-lg border shadow-none" required th:field="*{accountType}">
                <option value="" disabled selected>-- Select Account Type --</option>
                <option value="SAVINGS">Savings Account</option>
                <option value="CURRENT">Current Account</option>
              </select>
            </div>

            <!-- Initial Deposit -->
            <div class="mb-4">
              <label class="form-label text-muted fw-semibold small text-uppercase">Initial Deposit</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-end-0 text-muted fw-bold">₹</span>
                <input class="form-control bg-light border-start-0 ps-0 text-muted font-monospace" min="0" placeholder="0.00"
                  step="100" th:field="*{balance}" type="number" value="0" disabled />
              </div>
              <div class="form-text small text-danger mt-2">
                <i class="bi bi-lock-fill me-1"></i> Initial deposit requires teller or manager authorization.
              </div>
            </div>

            <!-- INFO Alert -->
            <div class="alert bg-info bg-opacity-10 text-info border-0 rounded-3 d-flex align-items-center p-3 mb-4 shadow-none">
              <i class="bi bi-info-circle-fill fs-4 me-3"></i>
              <small class="fw-medium">Account number will be generated automatically after administrative approval.</small>
            </div>

            <button class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm mt-2" type="submit">
              Submit Request <i class="bi bi-arrow-right ms-2"></i>
            </button>
          </form>
        </div>
      </div>

      <!-- Back Link -->
      <div class="text-center mt-4">
        <a class="text-decoration-none fw-medium text-muted" th:href="@{/accounts}">
          <i class="bi bi-arrow-left me-1"></i> Back to Accounts
        </a>
      </div>
      
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/app.js}"></script>
</body>

</html>
