<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head}">
  <meta charset="utf-8" />
</head>

<body>
  <div th:replace="~{fragments/navbar :: navbar}"></div>
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>

  <div class="main-content">
    <div class="container-fluid mt-2 px-md-4" style="max-width: 900px;">
      
      <!-- Page Header -->
      <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
        <div>
          <h4 class="fw-bold text-dark mb-1">
            <i class="bi bi-bell text-primary me-2"></i> Notifications
          </h4>
          <p class="text-muted small mb-0">Stay updated with your latest account alerts, security notices, and transaction updates.</p>
        </div>
      </div>

      <!-- Empty State -->
      <div class="card border-0 shadow-sm rounded-4 text-center p-5" th:if="${notifications.isEmpty()}">
        <div class="card-body py-5">
          <div class="bg-light rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px;">
            <i class="bi bi-bell-slash display-5 text-secondary opacity-50"></i>
          </div>
          <h5 class="fw-bold text-dark">No Notifications</h5>
          <p class="text-muted mb-0">You're all caught up! There are no unread alerts or notifications at this time.</p>
        </div>
      </div>

      <!-- Notification List Card -->
      <div class="card border-0 shadow-sm rounded-4 overflow-hidden" th:if="${!notifications.isEmpty()}">
        <div class="list-group list-group-flush">
          
          <div class="list-group-item p-4 border-bottom border-light" th:each="n : ${notifications}">
            <div class="d-flex align-items-start justify-content-between gap-3">
              
              <div class="d-flex align-items-start">
                <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center me-3 flex-shrink-0" style="width: 40px; height: 40px;">
                  <i class="bi bi-bell-fill"></i>
                </div>
                <div>
                  <p class="mb-0 text-dark fw-medium" th:text="${n.message}">Notification message goes here...</p>
                </div>
              </div>

              <div class="text-end flex-shrink-0">
                <span class="badge bg-light text-muted border px-3 py-2 fw-normal rounded-pill" th:text="${#temporals.format(n.createdAt, 'dd MMM yyyy, HH:mm')}">
                  01 Jan 2026, 12:00
                </span>
              </div>
              
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/app.js}"></script>
</body>

</html>
