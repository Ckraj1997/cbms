<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head}">
  <link rel="stylesheet" th:href="@{/css/login.css}" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
</head>

<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
  
  <div class="container d-flex justify-content-center align-items-center py-5">
    <div class="card border-0 shadow-lg rounded-4 overflow-hidden" style="width: 100%; max-width: 500px;">
      
      <!-- Subtle gradient accent bar -->
      <div style="height: 6px; background: var(--brand-gradient);"></div>
      
      <div class="card-body p-4 p-md-5">
        
        <!-- Logo and Branding -->
        <div class="text-center mb-4 pb-2">
          <img alt="FinCore Logo" class="img-fluid mx-auto d-block mb-3" style="max-width: 64px;" th:src="@{/images/logo.png}" />
          <h3 class="fw-bold text-dark mb-1">FinCore Banking</h3>
          <p class="text-muted small">Please sign in to your secure portal.</p>
        </div>

        <!-- Success Parameter Alert -->
        <div class="alert bg-success bg-opacity-10 text-success border-0 rounded-3 d-flex align-items-center p-3 mb-4 shadow-none" th:if="${success}">
          <i class="bi bi-check-circle-fill fs-5 me-2"></i>
          <span class="small fw-medium" th:text="${success}"></span>
        </div>

        <!-- Query Param: Error -->
        <div class="alert bg-danger bg-opacity-10 text-danger border-0 rounded-3 d-flex align-items-center p-3 mb-4 shadow-none" th:if="${param.error}">
          <i class="bi bi-exclamation-triangle-fill fs-5 me-2"></i>
          <span class="small fw-medium">Invalid credentials or account is blocked.</span>
        </div>

        <!-- Query Param: Logout -->
        <div class="alert bg-info bg-opacity-10 text-info border-0 rounded-3 d-flex align-items-center p-3 mb-4 shadow-none" th:if="${param.logout}">
          <i class="bi bi-info-circle-fill fs-5 me-2"></i>
          <span class="small fw-medium">You have been logged out successfully.</span>
        </div>

        <form method="post" th:action="@{/login}">
          
          <!-- Username -->
          <div class="mb-4">
            <label class="form-label text-muted fw-semibold small text-uppercase">Username</label>
            <div class="input-group input-group-lg">
              <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-person"></i></span>
              <input class="form-control bg-light border-0 shadow-none ps-2" name="placeholder-user" placeholder="Enter your username" required type="text" th:name="username" />
            </div>
          </div>

          <!-- Password -->
          <div class="mb-4">
            <label class="form-label text-muted fw-semibold small text-uppercase">Password</label>
            <div class="input-group input-group-lg">
              <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-lock"></i></span>
              <input class="form-control bg-light border-0 shadow-none ps-2" name="placeholder-pass" placeholder="Enter your password" required type="password" th:name="password" />
            </div>
          </div>

          <!-- Login Button -->
          <button class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm mt-2" type="submit">
            Sign In <i class="bi bi-arrow-right ms-2"></i>
          </button>

          <hr class="text-muted opacity-25 my-4" />

          <!-- Register Link -->
          <div class="text-center">
            <span class="text-muted small">New to FinCore?</span>
            <a class="fw-semibold text-decoration-none ms-1" th:href="@{/register}">
              Create Account
            </a>
          </div>
          
        </form>

        <!-- Security Footer Note -->
        <div class="text-center mt-5 pt-2">
          <small class="text-muted fw-medium">
            <i class="bi bi-shield-lock-fill text-success me-1"></i> Secure 256-bit Encrypted Portal
          </small>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/app.js}"></script>
</body>

</html>
