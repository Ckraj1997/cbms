<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head}"></head>

<body>
  <div th:replace="~{fragments/navbar :: navbar}"></div>
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>

  <div class="main-content">
    <div class="container-fluid mt-2 px-md-4">

      <!-- Alerts for Success/Error Actions -->
      <div class="alert alert-success alert-dismissible fade show border-0 shadow-sm rounded-3 mb-4" th:if="${success}">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
        <button class="btn-close" data-bs-dismiss="alert" type="button"></button>
      </div>
      <div class="alert alert-danger alert-dismissible fade show border-0 shadow-sm rounded-3 mb-4" th:if="${error}">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
        <button class="btn-close" data-bs-dismiss="alert" type="button"></button>
      </div>

      <!-- Page Header -->
      <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
        <div>
          <h4 class="fw-bold text-dark mb-1">
            <i class="bi bi-sliders text-primary me-2"></i> Loan Configuration
          </h4>
          <p class="text-muted small mb-0">Manage loan products, adjust interest rates, and toggle availability.</p>
        </div>
      </div>

      <!-- Add New Loan Product Card -->
      <div class="card border-0 shadow-sm rounded-4 mb-4 bg-primary bg-opacity-10 border border-primary border-opacity-25">
        <div class="card-body p-4">
          <h6 class="fw-bold text-primary mb-3 text-uppercase small">Add New Loan Product</h6>
          <form class="row g-3 align-items-center" method="post" th:action="@{/admin/loan-types/add}">
            <div class="col-md-5">
              <input class="form-control border-0 shadow-sm py-2" name="loanType" placeholder="Product Name (e.g., HOME_LOAN, AUTO_LOAN)" required type="text" />
            </div>
            <div class="col-md-4">
              <div class="input-group shadow-sm rounded">
                <span class="input-group-text bg-white border-0 text-muted fw-bold">Rate</span>
                <input class="form-control border-0" name="rate" placeholder="0.00" required step="0.01" type="number" />
                <span class="input-group-text bg-white border-0 text-muted fw-bold">%</span>
              </div>
            </div>
            <div class="col-md-3">
              <button class="btn btn-primary w-100 rounded-pill fw-bold shadow-sm py-2" type="submit">
                <i class="bi bi-plus-lg me-1"></i> Create Product
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Data Table Card -->
      <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle text-nowrap mb-0">
              <thead class="bg-light">
                <tr>
                  <th class="border-0 px-4 py-3 text-muted small fw-bold text-uppercase">Loan Type</th>
                  <th class="border-0 px-4 py-3 text-muted small fw-bold text-uppercase">Base Interest Rate</th>
                  <th class="border-0 px-4 py-3 text-muted small fw-bold text-uppercase">System Status</th>
                  <th class="border-0 px-4 py-3 text-muted small fw-bold text-uppercase text-end">Actions</th>
                </tr>
              </thead>
              <tbody class="border-top-0">
                
                <!-- Loan Product Row -->
                <tr th:each="type : ${loanTypes}">
                  <td class="px-4 py-3">
                    <div class="d-flex align-items-center">
                      <div class="bg-light rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 36px; height: 36px;">
                        <i class="bi bi-briefcase text-secondary"></i>
                      </div>
                      <span class="fw-bold text-dark" th:text="${type.loanType}">PERSONAL</span>
                    </div>
                  </td>
                  
                  <td class="px-4 py-3">
                    <span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 px-3 py-2 fw-bold fs-6">
                      <span th:text="${type.interestRate}">10.5</span>%
                    </span>
                  </td>
                  
                  <td class="px-4 py-3">
                    <span class="badge rounded-pill px-3 py-2 fw-semibold" 
                          th:classappend="${type.active} ? 'bg-success bg-opacity-10 text-success' : 'bg-secondary bg-opacity-10 text-secondary'"
                          th:text="${type.active} ? 'ACTIVE' : 'INACTIVE'">
                    </span>
                  </td>
                  
                  <td class="px-4 py-3 text-end">
                    <div class="d-flex gap-2 justify-content-end">
                      <button class="btn btn-sm btn-light border rounded-pill px-3 fw-medium shadow-sm text-primary" data-bs-toggle="modal" th:data-bs-target="'#editModal-' + ${type.id}">
                        <i class="bi bi-pencil me-1"></i> Edit
                      </button>

                      <form method="post" class="m-0" th:action="@{/admin/loan-types/delete}">
                        <input name="id" th:value="${type.id}" type="hidden" />
                        <button class="btn btn-sm btn-light text-danger border rounded-pill px-3 fw-medium shadow-sm" onclick="return confirm('Are you sure you want to delete this loan product?');" type="submit">
                          <i class="bi bi-trash me-1"></i> Delete
                        </button>
                      </form>
                    </div>

                    <!-- Modern Edit Modal -->
                    <div class="modal fade" tabindex="-1" th:id="'editModal-' + ${type.id}">
                      <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content border-0 shadow rounded-4 text-start">
                          <form method="post" th:action="@{/admin/loan-types/update}">
                            <div class="modal-header border-bottom-0 pb-0">
                              <h5 class="modal-title fw-bold text-dark">Modify Loan Product</h5>
                              <button class="btn-close" data-bs-dismiss="modal" type="button"></button>
                            </div>
                            <div class="modal-body px-4 pt-3 pb-4">
                              <input name="id" th:value="${type.id}" type="hidden" />

                              <div class="mb-4">
                                <label class="form-label text-muted small fw-semibold text-uppercase">Loan Type Identifier</label>
                                <input class="form-control bg-light text-muted font-monospace" disabled th:value="${type.loanType}" type="text" />
                              </div>

                              <div class="mb-4">
                                <label class="form-label text-muted small fw-semibold text-uppercase">New Base Interest Rate (%)</label>
                                <input class="form-control form-control-lg font-monospace text-primary fw-bold" name="rate" required step="0.01" th:value="${type.interestRate}" type="number" />
                              </div>

                              <div class="form-check form-switch p-3 bg-light rounded-3 border">
                                <input class="form-check-input ms-0 me-3 mt-1 fs-5" name="active" th:checked="${type.active}" type="checkbox" value="true" />
                                <label class="form-check-label fw-medium text-dark mt-1">Product is Active and Available to Customers</label>
                              </div>
                            </div>
                            <div class="modal-footer border-top-0 pt-0 px-4 pb-4">
                              <button class="btn btn-light rounded-pill px-4 fw-medium" data-bs-dismiss="modal" type="button">Cancel</button>
                              <button class="btn btn-primary rounded-pill px-4 fw-bold" type="submit">Save Configurations</button>
                            </div>
                          </form>
                        </div>
                      </div>
                    </div>
                    <!-- End Modal -->
                    
                  </td>
                </tr>

                <!-- Empty State -->
                <tr th:if="${#lists.isEmpty(loanTypes)}">
                  <td colspan="4" class="text-center py-5">
                    <div class="bg-light rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px;">
                      <i class="bi bi-slash-circle display-5 text-secondary opacity-50"></i>
                    </div>
                    <h5 class="fw-bold text-dark">No Loan Products</h5>
                    <p class="text-muted mb-0">Use the form above to add your first loan product.</p>
                  </td>
                </tr>

              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/app.js}"></script>
</body>

</html>
