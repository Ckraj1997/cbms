<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head}"></head>

<body>
  <div th:replace="~{fragments/navbar :: navbar}"></div>
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>

  <!-- Centered Focus Layout -->
  <div class="main-content d-flex flex-column align-items-center justify-content-center py-4" style="min-height: calc(100vh - 64px);">
    <div class="container" style="max-width: 600px">
      
      <!-- Alerts -->
      <div class="alert alert-danger alert-dismissible fade show border-0 shadow-sm rounded-3 mb-4" th:if="${error}">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
        <button class="btn-close" data-bs-dismiss="alert" type="button"></button>
      </div>
      <div class="alert alert-success alert-dismissible fade show border-0 shadow-sm rounded-3 mb-4" th:if="${success}">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
        <button class="btn-close" data-bs-dismiss="alert" type="button"></button>
      </div>

      <!-- Premium Transaction Card -->
      <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        
        <!-- Subtle gradient accent bar -->
        <div style="height: 6px; background: var(--brand-gradient);"></div>
        
        <div class="card-body p-4 p-md-5">
          
          <!-- Icon Header -->
          <div class="text-center mb-4 pb-2">
            <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
              <i class="bi bi-arrow-left-right fs-2"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">Self Credit / Debit</h4>
            <p class="text-muted small">Perform a direct balance adjustment or self-transaction on your account.</p>
          </div>

          <form method="post" th:action="@{/transactions/new}">
            
            <!-- ACCOUNT -->
            <div class="mb-4">
              <label class="form-label text-muted fw-semibold small text-uppercase">Account</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-wallet2"></i></span>
                <select class="form-select bg-light border-0 shadow-none ps-2 font-monospace" name="accountId" required>
                  <option disabled selected th:if="${#lists.isEmpty(accounts)}" value="">No active account found</option>
                  <option disabled selected th:if="${!#lists.isEmpty(accounts)}" value="">-- Select Account --</option>
                  <option th:each="acc : ${accounts}" th:text="${acc.accountNumber + ' (Bal: ₹' + acc.balance + ')'}" th:value="${acc.id}"></option>
                </select>
              </div>
            </div>

            <!-- TYPE -->
            <div class="mb-4">
              <label class="form-label text-muted fw-semibold small text-uppercase">Transaction Type</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-0 text-muted"><i class="bi bi-tag"></i></span>
                <select class="form-select bg-light border-0 shadow-none ps-2" name="type" required>
                  <option value="" disabled selected>-- Select Type --</option>
                  <option value="CREDIT">Credit (Deposit)</option>
                  <option value="DEBIT">Debit (Withdrawal)</option>
                </select>
              </div>
            </div>

            <!-- AMOUNT -->
            <div class="mb-4">
              <label class="form-label text-muted fw-semibold small text-uppercase">Amount</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-0 text-muted fw-bold">₹</span>
                <input class="form-control bg-light border-0 shadow-none ps-2 font-monospace fw-bold text-primary" min="1" name="amount" placeholder="0.00" required step="0.01" type="number" />
              </div>
            </div>

            <!-- Submit Action -->
            <button class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm mt-3" th:disabled="${#lists.isEmpty(accounts)}" type="submit">
              Submit Transaction <i class="bi bi-arrow-right ms-2"></i>
            </button>
            
          </form>
        </div>
      </div>

      <!-- Back Link -->
      <div class="text-center mt-4">
        <a class="text-decoration-none fw-medium text-muted hover-primary" th:href="@{/dashboard}">
          <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
        </a>
      </div>
      
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/app.js}"></script>
</body>

</html>
